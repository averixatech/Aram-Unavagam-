<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#176a4b"><title>ARAM Stock Management Cloud</title><style>
:root{--green:#176a4b;--line:#d9e5db}*{box-sizing:border-box}body{margin:0;background:#f2f7f3;color:#1c3026;font:15px system-ui,'Noto Sans Tamil',sans-serif}header{background:var(--green);color:white;padding:16px;font-size:20px;font-weight:750}main{max-width:1080px;margin:auto;padding:14px}.card{background:white;border:1px solid var(--line);border-radius:14px;padding:15px;margin:12px 0}input,select,textarea,button{font:inherit;border:1px solid #b8cdbd;border-radius:9px;padding:10px;max-width:100%}input,select,textarea{width:100%;background:white}label{display:block;margin:10px 0 5px;font-weight:650}button{background:var(--green);color:white;border:0;cursor:pointer;margin:5px 4px 5px 0}button.secondary{background:#e8f0e9;color:#175b40}button.danger{background:#a52a2a}.tabs{display:flex;flex-wrap:wrap;gap:5px}.tabs button{flex:1}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}.small{font-size:12px;color:#64766a}.pill{display:inline-block;background:#f1f6f2;border-radius:20px;padding:5px 10px;margin:3px}.negative{color:#b12c2c}table{border-collapse:collapse;width:100%;min-width:650px}td,th{padding:9px;border-bottom:1px solid var(--line);text-align:left;font-size:13px}.scroll{overflow-x:auto}.hidden{display:none}.top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap}.metric{font-size:26px;font-weight:800;color:var(--green)}.err{color:#ad2929}.good{color:#176a4b}.notice{background:#fff6df;padding:12px;border-radius:9px;margin:12px 0}#status{font-size:12px}h2{font-size:19px;margin:10px 0}

.stock-tile{padding:0;overflow:hidden;cursor:pointer;text-align:left;width:100%;background:white;color:inherit;border:1px solid var(--line);margin:0;display:block}
.stock-tile:focus-visible{outline:3px solid var(--green)}
.stock-photo{width:100%;height:132px;object-fit:cover;background:#eaf2e9;display:block}
.stock-photo-fallback{height:132px;background:#eaf2e9;display:flex;align-items:center;justify-content:center;font-size:52px}
.stock-tile-body{padding:12px}.stock-tile-body .metric{font-size:21px}
.stock-detail-back{margin:0 0 12px}.stock-detail-hero{display:flex;gap:16px;align-items:center;flex-wrap:wrap}.stock-detail-hero img{width:140px;height:115px;object-fit:cover;border-radius:12px}
.stock-detail-hero .stock-photo-fallback{width:140px;height:115px;border-radius:12px}
.stock-summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(125px,1fr));gap:8px}.stock-summary>div{background:#f1f7f2;padding:10px;border-radius:9px}
.stock-history-table{min-width:600px}

let accessLevel='viewer';let entryMode='purchase';let permissions={can_add:false,can_edit:false,can_delete:false};let sb=null,role='',user=null,db={items:[],logs:[]},version=0,activePage='dashboard',catalog=[],subscription=null,selectedStockId=null,memberNames={};

if(activePage==='reports'){let p=db.logs.filter(l=>l.type==='purchase');let grouped={};for(let l of p){let x=grouped[l.itemId]||(grouped[l.itemId]={name:l.name,qty:0,total:0,latest:0});x.qty+=Number(l.qty);x.total+=Number(l.qty)*Number(l.price);x.latest=Number(l.price)}c.innerHTML=`<div class="card"><h2>Purchase Rates & Spending</h2><div class="scroll"><table><tr><th>Item</th><th>Purchased Qty</th><th>Average Rate</th><th>Total Spend</th></tr>${Object.values(grouped).map(x=>`<tr><td>${esc(x.name)}</td><td>${x.qty.toFixed(2)}</td><td>${money(x.total/x.qty)}</td><td>${money(x.total)}</td></tr>`).join('')}</table></div><button onclick="exportCSV()">Export CSV</button></div>`}

async function loadTeam(){const {data,error}=await sb.rpc('aram_team_access');if(error){$('teamList').textContent=error.message;return}$('teamList').innerHTML=data.map(m=>`<div class="card"><b>${esc(m.display_name||m.user_id)}</b> — ${esc(m.role)} ${m.role==='owner'?'<p>Full access</p>':`<label>Access level</label><select id="level_${m.user_id}"><option value="viewer" ${m.access_level==='viewer'?'selected':''}>Only Viewer</option><option value="purchase_usage" ${m.access_level==='purchase_usage'?'selected':''}>Purchase & Usage Editor + View All</option><option value="full" ${m.access_level==='full'?'selected':''}>View All & Edit All (Add, Edit, Delete)</option></select><button onclick="savePermissions('${m.user_id}')">Save Access</button>`}</div>`).join('')}

function stockPhoto(item){
  const key=item.photoData||item.photo||catalog.find(c=>c.id===item.id)?.photo||'';
  return (typeof key==='string'&&key.startsWith('data:image/'))?key:(ARAM_PHOTOS[key]||'');
}
function stockEmoji(item){
  const cat=String(item.cat||'').toLowerCase();
  if(cat.includes('vegetable'))return '🥬';
  if(cat.includes('fruit'))return '🍎';
  if(cat.includes('rice')||cat.includes('grain'))return '🌾';
  if(cat.includes('dairy'))return '🥛';
  if(cat.includes('oil'))return '🫙';
  if(cat.includes('spice'))return '🌶️';
  if(cat.includes('clean'))return '🧼';
  if(cat.includes('pack'))return '📦';
  return '🛒';
}
function stockImageHTML(item){
  const photo=stockPhoto(item);
  if(photo)return `<img class="stock-photo" src="${photo}" alt="${esc(item.en)}" loading="lazy">`;
  return `<div class="stock-photo-fallback" aria-label="Photo not yet available">${stockEmoji(item)}</div>`;
}
function drawStock(){
  let search=$('search');if(!search)return;
  let q=search.value.toLowerCase(),list=db.items.filter(i=>i&&!i.archived&&((i.en||i.name||'')+' '+(i.ta||'')+' '+(i.cat||'')).toLowerCase().includes(q));

}
function drawManageItems(){const box=$('manageList');if(!box)return;const q=($('manageSearch')?.value||'').toLowerCase();const items=db.items.filter(i=>((i.en||'')+' '+(i.ta||'')).toLowerCase().includes(q));box.innerHTML=items.map(i=>`<div class="card" style="display:flex;align-items:center;gap:12px;flex-wrap:wrap"><div style="width:90px">${stockImageHTML(i)}</div><div style="flex:1;min-width:130px"><b>${esc(itemLabel(i))}</b><div class="small">${esc(appLang==='ta'?i.en:i.ta||'')} · ${i.archived?'Archived':'Active'} · ${balance(i)} ${esc(i.unit)}</div></div><button class="secondary" onclick="editItem('${esc(i.id)}')">${tr('edit')}</button><button class="${i.archived?'secondary':'danger'}" onclick="toggleArchiveItem('${esc(i.id)}')">${i.archived?tr('restore'):tr('remove')}</button></div>`).join('')||'<p>No items found</p>'}
async function toggleArchiveItem(id){if(accessLevel!=='full')return;const i=db.items.find(x=>x.id===id);if(!i)return;const hasHistory=db.logs.some(l=>l.itemId===id);if(!i.archived&&hasHistory&&!confirm('This item has transaction history. Archive it? History will be preserved.'))return;if(!i.archived&&!hasHistory&&!confirm('Remove this item from active stock? It can be restored later.'))return;if(i.archived&&!confirm('Restore this item to active stock?'))return;i.archived=!i.archived;const ok=await commit(i.archived?'Archive item':'Restore item');if(ok){activePage='stock';render()}}
function showStockDetail(id){
  selectedStockId=id;activePage='detail';
  const item=db.items.find(i=>i.id===id);if(!item)return;
  const logs=db.logs.filter(l=>l.itemId===id).slice().sort((a,b)=>String(b.date||'').localeCompare(String(a.date||'')));
  const purchased=logs.filter(l=>l.type==='purchase').reduce((n,l)=>n+Number(l.qty||0),0);
  const used=logs.filter(l=>l.type==='usage').reduce((n,l)=>n+Number(l.qty||0),0);
  const wasted=logs.filter(l=>l.type==='wastage').reduce((n,l)=>n+Number(l.qty||0),0);
  const photo=stockPhoto(item);
  $('content').innerHTML=`<div class="card"><button class="secondary stock-detail-back" onclick="activePage='stock';render()">← ${tr('back')}</button>
  <div class="stock-detail-hero">${photo?`<img src="${photo}" alt="${esc(item.en)}">`:`<div class="stock-photo-fallback">${stockEmoji(item)}</div>`}
  <div><h2>${esc(itemLabel(item))} / ${esc(appLang==='ta'?item.en:item.ta)}</h2><div class="small">${esc(item.cat)} · ${esc(item.unit)}</div><div class="metric">Balance: ${balance(item)} ${esc(item.unit)}</div>${accessLevel==='full'?`<button class="secondary" onclick="editItem('${esc(item.id)}')">${tr('edit')}</button><button class="danger" onclick="toggleArchiveItem('${esc(item.id)}')">${item.archived?tr('restore'):tr('remove')}</button>`:''}</div></div>
  <div class="stock-summary"><div><div class="small">Opening</div><b>${Number(item.opening||0)} ${esc(item.unit)}</b></div><div><div class="small">Purchased</div><b>${purchased} ${esc(item.unit)}</b></div><div><div class="small">Used</div><b>${used} ${esc(item.unit)}</b></div><div><div class="small">Wastage</div><b>${wasted} ${esc(item.unit)}</b></div></div>

  </div>`;
}

function typeChange(){$('purchaseFields').classList.toggle('hidden',$('etype').value!=='purchase');$('usageFields').classList.toggle('hidden',$('etype').value!=='usage')}
function givenChange(){$('otherField').classList.toggle('hidden',$('given').value!=='Others')}
async function saveEntry(){if(!canAddType($('etype').value))return alert('Permission denied');let i=db.items.find(x=>x.id===$('item').value),t=$('etype').value,q=Number($('qty').value),date=$('date').value,rate=t==='purchase'?Number($('rate').value):Number(i.price||0),given=t==='usage'?$('given').value:'';if(!i||!Number.isFinite(q)||q<=0||!date||!Number.isFinite(rate)||rate<0)return alert('Enter valid quantity/date/rate');if(t==='usage'&&(!given||(given==='Others'&&!$('other').value.trim())))return alert('Select or type recipient');if(t!=='purchase'&&q>balance(i))return alert('Not enough stock');if(given==='Others')given='Others - '+$('other').value.trim();let l={id:crypto.randomUUID(),itemId:i.id,name:i.en,type:t,qty:q,date,price:rate,supplier:t==='purchase'?$('supplier').value:'',givenTo:given,notes:$('notes').value,by:user.id};if(role!=='owner'){
  try{
    const {data,error}=await sb.rpc('aram_add_entry',{expected_version:version,new_entry:l});
    if(error)throw error;
    version=Number(data);
    await fetchState();
    message('Entry saved to cloud ✓');
    activePage='history';render();
  }catch(e){message('Entry save failed: '+e.message,true);await fetchState().catch(()=>{});}
  return;
}db.logs.push(l);if(t==='purchase')i.price=rate;if(!valid(db.logs))return alert('Invalid stock history');if(await commit('Entry')){activePage='history';render()}}
async function deleteEntry(id){if(!permissions.can_delete)return;if(!confirm('Delete this entry?'))return;let logs=db.logs.filter(l=>l.id!==id);if(!valid(logs))return alert('Cannot delete: stock would become negative');db.logs=logs;await commit('Delete')}
function editEntry(id){let l=db.logs.find(x=>x.id===id);if(!l||!canEditLog(l))return;let c=$('content');c.innerHTML=`<div class="card"><h2>Edit transaction</h2><label>Item</label><select id="eitem">${db.items.map(i=>`<option value="${esc(i.id)}" ${l.itemId===i.id?'selected':''}>${esc(i.en)}</option>`).join('')}</select><label>Type</label><select id="et"><option>purchase</option><option>usage</option><option>wastage</option></select><label>Quantity</label><input type="number" step="any" id="eq" value="${l.qty}"><label>Rate</label><input type="number" step="any" id="er" value="${l.price}"><label>Date</label><input type="date" id="ed" value="${esc(l.date)}"><label>Given To (Usage) / Supplier (Purchase)</label><input id="erec" value="${esc(l.givenTo||l.supplier||'')}"><label>Notes</label><input id="enotes" value="${esc(l.notes||'')}"><button onclick="saveEdit('${esc(id)}')">Save Edit</button><button class="secondary" onclick="activePage='history';render()">Cancel</button></div>`;$('et').value=l.type;if(accessLevel==='purchase_usage'){$('et').querySelector('option:last-child').remove()}}
async function saveEdit(id){let old=db.logs.find(l=>l.id===id);if(!old||!canEditLog(old)||!canAddType($('et').value))return alert('Permission denied');let i=db.items.find(i=>i.id===$('eitem').value),t=$('et').value,q=Number($('eq').value),rate=Number($('er').value),date=$('ed').value,recipient=$('erec').value.trim();if(!i||q<=0||!Number.isFinite(q)||rate<0||!Number.isFinite(rate)||!date||(t==='usage'&&!recipient))return alert('Invalid entry');let updated={...old,itemId:i.id,name:i.en,type:t,qty:q,price:rate,date,givenTo:t==='usage'?recipient:'',supplier:t==='purchase'?recipient:'',notes:$('enotes').value};let logs=db.logs.map(l=>l.id===id?updated:l);if(!valid(logs))return alert('Negative stock not allowed');db.logs=logs;await commit('Edit');activePage='history';render()}
function editItem(id){
  if(accessLevel!=='full')return;
  let i=db.items.find(x=>x.id===id)||{id:crypto.randomUUID(),en:'',ta:'',cat:'Other',unit:'kg',opening:0,reorder:0,price:0};
  window.aramEditPhoto=i.photoData||'';
  $('content').innerHTML=`<div class="card"><h2>${id?'Edit':'Add'} Item</h2>
  <label>Item photo / பொருள் படம்</label><div id="photoPreview" style="max-width:260px;margin:10px 0">${stockImageHTML(i)}</div>
  <input type="file" id="itemPhotoFile" accept="image/*" onchange="previewItemPhoto(this)">
  <p class="small">Choose from phone Gallery or Camera. Image is resized before cloud saving. Owner only.</p>
  <button class="secondary" type="button" onclick="clearItemPhoto()">Remove uploaded photo</button>
  ${['en','ta','cat','unit','opening','reorder','price'].map(k=>`<label>${esc(({en:'En',ta:'Ta',cat:'Category',unit:'Unit',opening:'Opening',reorder:'Reorder',price:'Price'})[k])}</label><input id="i_${k}" value="${esc(i[k])}">`).join('')}
  <button id="itemSaveBtn" onclick="saveItem('${esc(id||'')}','${esc(i.id)}')">Save Item & Photo to Cloud</button>
  <button class="secondary" onclick="activePage='stock';render()">Cancel</button></div>`;
}
async function previewItemPhoto(input){
  if(accessLevel!=='full'||!input.files?.[0])return;
  const file=input.files[0];
  if(!file.type.startsWith('image/'))return alert('Please select an image');
  if(file.size>12*1024*1024)return alert('Choose a photo smaller than 12 MB');
  try{
    const image=await createImageBitmap(file);
    const scale=Math.min(1,360/image.width,270/image.height);
    const canvas=document.createElement('canvas');
    canvas.width=Math.max(1,Math.round(image.width*scale));canvas.height=Math.max(1,Math.round(image.height*scale));
    canvas.getContext('2d').drawImage(image,0,0,canvas.width,canvas.height);
    image.close?.();
    window.aramEditPhoto=canvas.toDataURL('image/jpeg',0.64);
    if(window.aramEditPhoto.length>100000)throw Error('Photo too large after resizing. Try another image.');
    $('photoPreview').innerHTML='<img class="stock-photo" alt="Selected photo preview">';
    $('photoPreview').querySelector('img').src=window.aramEditPhoto;
  }catch(e){alert('Could not load photo: '+e.message)}
}
function clearItemPhoto(){window.aramEditPhoto='';$('photoPreview').innerHTML='<div class="stock-photo-fallback">📷</div>';if($('itemPhotoFile'))$('itemPhotoFile').value=''}
async function saveItem(oldId,id){
  if(accessLevel!=='full')return;
  let i={id};for(let k of ['en','ta','cat','unit','opening','reorder','price'])i[k]=$('i_'+k).value;
  for(let k of ['opening','reorder','price'])i[k]=Number(i[k]);
  if(!i.en||!i.unit||['opening','reorder','price'].some(k=>!Number.isFinite(i[k])||i[k]<0))return alert('Invalid item');
  let old=db.items.find(x=>x.id===oldId);
  i={...(old||{}),...i};
  if(window.aramEditPhoto)i.photoData=window.aramEditPhoto;else delete i.photoData;
  const previousItems=db.items;
  db.items=old?db.items.map(x=>x.id===oldId?i:x):[...db.items,i];
  if(!valid(db.logs)){db.items=previousItems;return alert('Invalid opening stock')}
  const button=$('itemSaveBtn');if(button)button.disabled=true;
  const ok=await commit('Item and photo');
  if(ok){activePage='stock';render()}
}
function download(name,content,type){let a=document.createElement('a'),u=URL.createObjectURL(new Blob([content],{type}));a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function backup(){download('ARAM-cloud-backup-'+today()+'.json',JSON.stringify(db,null,2),'application/json')}
async function restoreBackup(){if(role!=='owner')return;let f=$('restoreFile').files[0];if(!f)return;try{let obj=JSON.parse(await f.text());if(!Array.isArray(obj.items)||!Array.isArray(obj.logs)||!valid(obj.logs,obj.items))throw Error('Invalid stock data');if(!confirm('Replace ALL cloud data? Other devices will be affected.'))return;db={items:obj.items,logs:obj.logs};await commit('Restore')}catch(e){alert(e.message)}}
function exportCSV(){let rows=[['Date','Type','Item','Quantity','Rate INR','Purchase Total INR','Supplier','Given To','Notes','Recorded By'],...db.logs.map(l=>[l.date,l.type,l.name,l.qty,l.price,l.type==='purchase'?l.qty*l.price:'',l.supplier||'',l.givenTo||'',l.notes||'',l.by||''])];download('ARAM-transactions.csv','\ufeff'+rows.map(row=>row.map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(',')).join('\r\n'),'text/csv')}
(async()=>{try{let cfg=window.ARAM_CONFIG;if(!cfg?.url||!cfg?.anonKey){message('Website code ready. Configure Supabase in config.js before publishing.',true);return}sb=supabase.createClient(cfg.url,cfg.anonKey);let r=await fetch('catalog.json');catalog=await r.json();let {data}=await sb.auth.getUser();if(data?.user)await start(data.user)}catch(e){message(e.message,true)}})();
